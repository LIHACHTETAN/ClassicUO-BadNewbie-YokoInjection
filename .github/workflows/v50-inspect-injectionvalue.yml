name: v50 inspect InjectionValue registration

on:
  push:
    paths:
      - .github/workflows/v50-inspect-injectionvalue.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA256: 070cc3821c836d8470a6b10e295014cabcf8f2ad74ae3c4dddf5d8a6659f23ed

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download and inspect current v50 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $shares=@(
            @{ Share='ENGSULZWiyg3'; Name='part00'; Size=94371840; Sha='18a2e2a672d44f90215458ddbf81ee82e57dcb1cb11d57c0dae42a79b063c1c6' },
            @{ Share='vO3RI-uepxuC'; Name='part01'; Size=94371840; Sha='8a81a16359db3396017a60146e2414e873b9738b5a2553a586045cdb6f4c0846' },
            @{ Share='L0ABqCBELFZo'; Name='part02'; Size=68451382; Sha='5cd92a807e7db72b22c83f04b554f5db5563c3871cb43665f707491cc4b6d96a' }
          )
          foreach($s in $shares){
            $list=Invoke-RestMethod -Uri "https://api.firestorage.ai/dev/file/shares/$($s.Share)/files?maxResults=1000"
            $file=$list.files[0]
            if(-not $file -or [int64]$file.sizeBytes -ne [int64]$s.Size){throw "Share metadata mismatch: $($s.Name)"}
            $d=Invoke-RestMethod -Uri "https://api.firestorage.ai/dev/file/shares/$($s.Share)/files/$($file.fileId)/download" -Method Post -ContentType 'application/json'
            $out=Join-Path $env:RUNNER_TEMP $s.Name
            Invoke-WebRequest $d.downloadUrl -OutFile $out -UseBasicParsing -MaximumRedirection 10
            $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if((Get-Item $out).Length -ne $s.Size -or $sha -ne $s.Sha){throw "Part verification failed: $($s.Name)"}
          }
          $joined=Join-Path $env:RUNNER_TEMP 'ClassicUO-v50-current-input.zip'
          $dst=[IO.File]::Open($joined,[IO.FileMode]::Create)
          try{foreach($n in @('part00','part01','part02')){$src=[IO.File]::OpenRead((Join-Path $env:RUNNER_TEMP $n));try{$src.CopyTo($dst)}finally{$src.Dispose()}}}finally{$dst.Dispose()}
          $sha=(Get-FileHash $joined -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:EXPECTED_SOURCE_SHA256){throw "Source SHA mismatch: $sha"}
          $root=Join-Path $env:RUNNER_TEMP 'v50-inspect'
          Expand-Archive $joined $root -Force
          $rt=Join-Path $root 'project/external/InjectionScript/src/InjectionScript/Runtime'
          function Show-Lines([string]$path,[int]$from,[int]$to){
            Write-Host "===== $path lines $from..$to ====="
            $lines=Get-Content $path
            for($i=$from;$i -le $to -and $i -le $lines.Count;$i++){Write-Host ("{0:D4}: {1}" -f $i,$lines[$i-1])}
          }
          Show-Lines (Join-Path $rt 'InjectionValue.cs') 130 195
          Show-Lines (Join-Path $rt 'NativeSubrutineDefinition.cs') 270 335
          Show-Lines (Join-Path $rt 'InjectionApiUO.cs') 490 525
          Write-Host '===== InjectionValue delegate/registration references ====='
          Select-String -Path (Join-Path $rt '*.cs') -Pattern 'InjectionValue|NativeSubrutineDefinition' | Where-Object { $_.Path -match 'InjectionApiUO|NativeSubrutineDefinition|InjectionValue' } | Select-Object -First 120 | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }

          $tests=Join-Path $root 'project/tests/ClassicUO.UnitTests/Game/Managers'
          Show-Lines (Join-Path $tests 'YokoTheiaIoResponsivenessTests.cs') 315 410
          Show-Lines (Join-Path $tests 'YokoSelectedAutoloadStartupTests.cs') 95 135
          Show-Lines (Join-Path $tests 'YokoInjectionCompatibilityTests.cs') 900 955
          Show-Lines (Join-Path $tests 'YokoInjectionCompatibilityTests.cs') 1460 1510
