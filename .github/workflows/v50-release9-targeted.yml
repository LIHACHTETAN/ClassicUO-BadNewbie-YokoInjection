name: v50 Release 9 targeted regression gate

on:
  push:
    paths:
      - .github/workflows/v50-release9-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA256: 070cc3821c836d8470a6b10e295014cabcf8f2ad74ae3c4dddf5d8a6659f23ed

jobs:
  targeted-regressions:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Release 9 patch tooling
        uses: actions/checkout@v4
        with:
          ref: ClientUO-Age-of-Power

      - name: Setup exact .NET SDK 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Download verify and patch exact current v50 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $shares=@(
            @{ Share='ENGSULZWiyg3'; Name='part00'; Size=94371840; Sha='18a2e2a672d44f90215458ddbf81ee82e57dcb1cb11d57c0dae42a79b063c1c6' },
            @{ Share='vO3RI-uepxuC'; Name='part01'; Size=94371840; Sha='8a81a16359db3396017a60146e2414e873b9738b5a2553a586045cdb6f4c0846' },
            @{ Share='L0ABqCBELFZo'; Name='part02'; Size=68451382; Sha='5cd92a807e7db72b22c83f04b554f5db5563c3871cb43665f707491cc4b6d96a' }
          )
          foreach($s in $shares){
            $list=Invoke-RestMethod -Uri "https://api.firestorage.ai/dev/file/shares/$($s.Share)/files?maxResults=1000"
            $file=$list.files[0]
            if(-not $file -or [int64]$file.sizeBytes -ne [int64]$s.Size){throw "Share metadata mismatch: $($s.Name)"}
            $d=Invoke-RestMethod -Uri "https://api.firestorage.ai/dev/file/shares/$($s.Share)/files/$($file.fileId)/download" -Method Post -ContentType 'application/json'
            $out=Join-Path $env:RUNNER_TEMP $s.Name
            Invoke-WebRequest $d.downloadUrl -OutFile $out -UseBasicParsing -MaximumRedirection 10
            $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if((Get-Item $out).Length -ne $s.Size -or $sha -ne $s.Sha){throw "Part verification failed: $($s.Name)"}
          }
          $joined=Join-Path $env:RUNNER_TEMP 'ClassicUO-v50-current-input.zip'
          $dst=[IO.File]::Open($joined,[IO.FileMode]::Create)
          try {
            foreach($n in @('part00','part01','part02')) {
              $src=[IO.File]::OpenRead((Join-Path $env:RUNNER_TEMP $n))
              try{$src.CopyTo($dst)}finally{$src.Dispose()}
            }
          } finally {$dst.Dispose()}
          $sha=(Get-FileHash $joined -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:EXPECTED_SOURCE_SHA256){throw "Source SHA mismatch: $sha"}
          Write-Host "SOURCE_SHA256=$sha"

          $root=Join-Path $env:RUNNER_TEMP 'v50-release9-targeted'
          Expand-Archive $joined $root -Force
          $project=Join-Path $root 'project'
          $g=Get-Content (Join-Path $project 'global.json') -Raw|ConvertFrom-Json
          $g.sdk.rollForward='disable'
          $g|ConvertTo-Json -Depth 8|Set-Content (Join-Path $project 'global.json') -Encoding utf8

          python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/patch-v50-release8.py') $project
          if($LASTEXITCODE -ne 0){throw "Release 8 base patch failed with $LASTEXITCODE"}
          python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/patch-v50-release9-post.py') $project
          if($LASTEXITCODE -ne 0){throw "Release 9 residual patch failed with $LASTEXITCODE"}

          "V50_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:V50_PROJECT
          $v=(& dotnet --version).Trim()
          if($v -ne '10.0.302'){throw "Wrong SDK $v"}
          python scripts/VerifyV50Ide.py
          if($LASTEXITCODE -ne 0){throw 'VerifyV50Ide failed'}
          python scripts/TestDoorPathfindingV50.py
          if($LASTEXITCODE -ne 0){throw 'Door/pathfinding verifier failed'}

      - name: Restore and build targeted test assembly
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:V50_PROJECT
          dotnet restore tests/ClassicUO.UnitTests/ClassicUO.UnitTests.csproj -p:NuGetAudit=false
          if($LASTEXITCODE -ne 0){throw 'Targeted test restore failed'}
          dotnet build tests/ClassicUO.UnitTests/ClassicUO.UnitTests.csproj -c Release --no-restore -p:NuGetAudit=false
          if($LASTEXITCODE -ne 0){throw 'Targeted test build failed'}

      - name: Run the seven residual regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:V50_PROJECT
          $filter='FullyQualifiedName~Autoload_Catalogue_Scans_Only_The_Active_Directory_Not_Nested_Libraries|FullyQualifiedName~Cold_And_Warm_Bound_Commands_Do_Not_Block_The_Game_Thread|FullyQualifiedName~NewMoveXY_Manual_Explains_Every_Argument_And_Actual_ClassicUO_Path|FullyQualifiedName~Runtime_Manual_Excludes_Workspace_Procedures_From_Authoritative_Catalog|FullyQualifiedName~Every_Active_Autoload_Script_Parses_Without_Errors|FullyQualifiedName~Api_Manual_Provides_All_Requested_Languages_Pictures_And_Yoko_Only_Descriptions|FullyQualifiedName~Injection_2015_State_And_Object_Functions_Are_Registered_With_Their_Parameters'
          dotnet test tests/ClassicUO.UnitTests/ClassicUO.UnitTests.csproj -c Release --no-build --no-restore --filter $filter --logger "console;verbosity=normal" --logger "trx;LogFileName=Release9-targeted.trx"
          if($LASTEXITCODE -ne 0){throw 'Release 9 targeted regressions failed'}
