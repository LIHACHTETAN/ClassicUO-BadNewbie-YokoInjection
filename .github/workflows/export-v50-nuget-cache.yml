name: Export v50 NuGet cache

on:
  push:
    branches:
      - ClientUO-Age-of-Power
    paths:
      - _nugetcache/READY

permissions:
  contents: read

jobs:
  export-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Pin SDK
        shell: bash
        run: |
          cat > global.json <<'EOF'
          {"sdk":{"version":"10.0.302","rollForward":"disable"}}
          EOF
          test "$(dotnet --version)" = "10.0.302"

      - name: Restore all direct package versions and win-x64 packs
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, os, re
          pairs = [
            ('Antlr4.CodeGenerator','4.6.5'),('Antlr4.Runtime','4.6.5'),
            ('CommandLineParser','2.3.0'),
            ('FluentAssertions','5.5.3'),('FluentAssertions','5.9.0'),('FluentAssertions','6.12.0'),
            ('MSTest.TestAdapter','1.3.2'),('MSTest.TestAdapter','2.2.8'),
            ('MSTest.TestFramework','1.3.2'),('MSTest.TestFramework','2.2.8'),
            ('Microsoft.ApplicationInsights','2.8.1'),
            ('Microsoft.CodeAnalysis.Analyzers','3.3.3'),('Microsoft.CodeAnalysis.CSharp','4.2.0'),
            ('Microsoft.NET.Test.Sdk','15.8.0'),('Microsoft.NET.Test.Sdk','17.0.0'),('Microsoft.NET.Test.Sdk','17.2.0'),('Microsoft.NET.Test.Sdk','17.10.0'),
            ('Microsoft.NETFramework.ReferenceAssemblies','1.0.3'),('Microsoft.TestPlatform.ObjectModel','16.6.1'),
            ('Microsoft.Web.WebView2','1.0.4129.50'),('OmniSharp.Extensions.LanguageServer','0.10.0'),
            ('SixLabors.ImageSharp','3.1.11'),('System.Buffers','4.5.1'),('System.Memory','4.5.5'),
            ('System.Runtime.CompilerServices.Unsafe','6.0.0'),('Verify.SourceGenerators','1.5.0'),('Verify.XUnit','17.5.0'),
            ('coverlet.collector','3.1.2'),('coverlet.collector','6.0.2'),
            ('xunit','2.4.2'),('xunit','2.9.0'),('xunit.runner.visualstudio','2.4.5'),('xunit.runner.visualstudio','2.8.2')
          ]
          root=Path(os.environ['RUNNER_TEMP'])/'restore'
          for i,(pkg,ver) in enumerate(pairs):
              d=root/f'p{i:02d}'
              d.mkdir(parents=True, exist_ok=True)
              # net8.0 gives broad compatibility and downloads the exact requested nupkg plus transitives.
              csproj=f'''<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="{pkg}" Version="{ver}" /></ItemGroup></Project>'''
              (d/'p.csproj').write_text(csproj)
              subprocess.run(['dotnet','restore',str(d/'p.csproj'),'--verbosity','quiet'],check=True)
          # Force Windows self-contained + NativeAOT restore packs used by the actual v50 pipeline.
          d=root/'winpacks'; d.mkdir(exist_ok=True)
          (d/'p.csproj').write_text('''<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><RuntimeIdentifier>win-x64</RuntimeIdentifier><SelfContained>true</SelfContained><PublishAot>true</PublishAot></PropertyGroup></Project>''')
          (d/'Program.cs').write_text('class P { static void Main() {} }')
          subprocess.run(['dotnet','restore',str(d/'p.csproj'),'--verbosity','minimal'],check=True)
          PY
          du -sh "$NUGET_PACKAGES"

      - name: Pack NuGet cache
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        run: |
          set -euo pipefail
          tar -C "$NUGET_PACKAGES" -cJf "$RUNNER_TEMP/v50-nuget-cache.tar.xz" .
          sha256sum "$RUNNER_TEMP/v50-nuget-cache.tar.xz" > "$RUNNER_TEMP/v50-nuget-cache.tar.xz.sha256"
          ls -lh "$RUNNER_TEMP/v50-nuget-cache.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: v50-nuget-cache
          path: |
            ${{ runner.temp }}/v50-nuget-cache.tar.xz
            ${{ runner.temp }}/v50-nuget-cache.tar.xz.sha256
          compression-level: 0
          retention-days: 1
