name: v50.0.2 fixed full release

on:
  push:
    paths:
      - .github/workflows/v50-current-v50-0-2-release-fixed.yml
      - .github/scripts/patch-v50-0-2.py
      - .github/scripts/patch-v50-0-2-gump-model.py
      - .github/scripts/patch-v50-0-2-build-manual.py
      - .github/scripts/manual-v50-0-2.py
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA256: 070cc3821c836d8470a6b10e295014cabcf8f2ad74ae3c4dddf5d8a6659f23ed

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: ClientUO-Age-of-Power

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Download exact source and apply v50.0.2 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=@(
            @{Share='ENGSULZWiyg3';Name='part00';Size=94371840;Sha='18a2e2a672d44f90215458ddbf81ee82e57dcb1cb11d57c0dae42a79b063c1c6'},
            @{Share='vO3RI-uepxuC';Name='part01';Size=94371840;Sha='8a81a16359db3396017a60146e2414e873b9738b5a2553a586045cdb6f4c0846'},
            @{Share='L0ABqCBELFZo';Name='part02';Size=68451382;Sha='5cd92a807e7db72b22c83f04b554f5db5563c3871cb43665f707491cc4b6d96a'}
          )
          foreach($p in $parts){
            $list=Invoke-RestMethod "https://api.firestorage.ai/dev/file/shares/$($p.Share)/files?maxResults=1000"
            $f=$list.files[0]
            if(-not $f -or [int64]$f.sizeBytes -ne [int64]$p.Size){throw "Source part metadata mismatch $($p.Name)"}
            $d=Invoke-RestMethod -Uri "https://api.firestorage.ai/dev/file/shares/$($p.Share)/files/$($f.fileId)/download" -Method Post -ContentType 'application/json'
            $out=Join-Path $env:RUNNER_TEMP $p.Name
            Invoke-WebRequest $d.downloadUrl -OutFile $out -UseBasicParsing -MaximumRedirection 10
            if((Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant() -ne $p.Sha){throw "Source part hash mismatch $($p.Name)"}
          }
          $joined=Join-Path $env:RUNNER_TEMP 'v50-source.zip'
          $dst=[IO.File]::Open($joined,[IO.FileMode]::Create)
          try{
            foreach($n in @('part00','part01','part02')){
              $src=[IO.File]::OpenRead((Join-Path $env:RUNNER_TEMP $n))
              try{$src.CopyTo($dst)}finally{$src.Dispose()}
            }
          }finally{$dst.Dispose()}
          $sha=(Get-FileHash $joined -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:EXPECTED_SOURCE_SHA256){throw "Combined source SHA mismatch $sha"}

          $root=Join-Path $env:RUNNER_TEMP 'v50.0.2-fixed-work'
          Expand-Archive $joined $root -Force
          $project=Join-Path $root 'project'
          $baseline=Join-Path $root 'client'

          $g=Get-Content (Join-Path $project 'global.json') -Raw|ConvertFrom-Json
          $g.sdk.rollForward='disable'
          $g|ConvertTo-Json -Depth 8|Set-Content (Join-Path $project 'global.json') -Encoding utf8

          foreach($name in @('patch-v50-release10.py','patch-v50-release11-theia.py','patch-v50-release12-fastzip.py','patch-v50-0-2.py','patch-v50-0-2-gump-model.py')){
            python (Join-Path $env:GITHUB_WORKSPACE ".github/scripts/$name") $project
            if($LASTEXITCODE -ne 0){throw "$name failed: $LASTEXITCODE"}
          }

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/manual-v50-0-2.py') (Join-Path $project 'scripts/ApplyV5002ManualPatch.py') -Force
          python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/patch-v50-0-2-build-manual.py') (Join-Path $project 'BUILD_V50_WINDOWS.ps1')
          if($LASTEXITCODE -ne 0){throw 'BUILD_V50_WINDOWS Manual integration patch failed'}

          "V50_ROOT=$root"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "V50_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "V50_BASELINE_CLIENT=$baseline"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build test NativeAOT and smoke fresh Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:V50_PROJECT
          if((& dotnet --version).Trim() -ne '10.0.302'){throw 'Wrong .NET SDK'}
          $built=Join-Path $env:V50_ROOT 'client-v50.0.2-fixed-built'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:V50_PROJECT 'BUILD_V50_WINDOWS.ps1') -OutputDirectory $built -BaselineClientDirectory $env:V50_BASELINE_CLIENT -SmokeTestSeconds 15
          if($LASTEXITCODE -ne 0){throw "BUILD_V50_WINDOWS failed $LASTEXITCODE"}

          python (Join-Path $env:V50_PROJECT 'scripts/ApplyV5002ManualPatch.py') $env:V50_PROJECT
          if($LASTEXITCODE -ne 0){throw 'Final v50.0.2 Manual patch failed'}
          python scripts\TestApiManualCurrent.py
          if($LASTEXITCODE -ne 0){throw 'Final 52/52 Manual gate failed'}

          $manual=Join-Path $env:V50_PROJECT 'src/ClassicUO.Client/YokoDocumentation/Manual/COMPLETE_RUNTIME_API_MANUAL.md'
          $dest=Join-Path $built 'YokoDocumentation/Manual/COMPLETE_RUNTIME_API_MANUAL.md'
          New-Item -ItemType Directory (Split-Path $dest) -Force|Out-Null
          Copy-Item $manual $dest -Force

          $exe=Join-Path $built 'ClassicUO.exe'
          $dll=Join-Path $built 'cuo.dll'
          $api=Join-Path $built 'cuoapi.dll'
          foreach($f in @($exe,$dll,$api)){if(-not(Test-Path $f)){throw "Missing fresh binary $f"}}
          if((Get-Item $exe).VersionInfo.FileVersion -ne '50.0.2.0'){throw 'ClassicUO.exe is not v50.0.2.0'}
          if((Get-Item $dll).VersionInfo.FileVersion -ne '50.0.2.0'){throw 'cuo.dll is not v50.0.2.0'}
          "V50_BUILT_CLIENT=$built"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Project plus Client and verify extracted result
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'v50.0.2-fixed-package'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          New-Item -ItemType Directory $stage -Force|Out-Null
          Copy-Item $env:V50_PROJECT (Join-Path $stage 'project') -Recurse -Force
          Copy-Item $env:V50_BUILT_CLIENT (Join-Path $stage 'client') -Recurse -Force
          Get-ChildItem (Join-Path $stage 'project') -Recurse -Directory -Force -ErrorAction SilentlyContinue |
            Where-Object{$_.Name -in @('bin','obj','publish','__pycache__')} |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $zip=Join-Path $env:RUNNER_TEMP 'ClassicUO-v50.0.2-BADNEWBIE-YOKO-FINAL-PROJECT-AND-CLIENT.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          & (Get-Command tar.exe).Source -a -cf $zip -C $stage .
          if($LASTEXITCODE -ne 0){throw 'ZIP create failed'}
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $(Split-Path $zip -Leaf)"|Set-Content "$zip.sha256.txt" -Encoding ascii

          $verify=Join-Path $env:RUNNER_TEMP 'v50.0.2-fixed-extracted'
          if(Test-Path $verify){Remove-Item $verify -Recurse -Force}
          Expand-Archive $zip $verify -Force
          foreach($r in @(
            'client/ClassicUO.exe',
            'client/cuo.dll',
            'client/cuoapi.dll',
            'client/Theia/ClassicUO.TheiaHost.exe',
            'project/ClassicUO.sln',
            'project/tests/ClassicUO.UnitTests/Game/Managers/YokoCommandEndToEndTests.cs',
            'project/src/ClassicUO.Client/YokoDocumentation/Manual/COMPLETE_RUNTIME_API_MANUAL.md',
            'client/YokoDocumentation/Manual/COMPLETE_RUNTIME_API_MANUAL.md'
          )){
            if(-not(Test-Path(Join-Path $verify $r))){throw "ZIP missing $r"}
          }
          $pm=(Get-FileHash (Join-Path $verify 'project/src/ClassicUO.Client/YokoDocumentation/Manual/COMPLETE_RUNTIME_API_MANUAL.md') -Algorithm SHA256).Hash
          $cm=(Get-FileHash (Join-Path $verify 'client/YokoDocumentation/Manual/COMPLETE_RUNTIME_API_MANUAL.md') -Algorithm SHA256).Hash
          if($pm -ne $cm){throw 'Project/client Manual mismatch'}
          & pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_run_extracted_client_smoke.ps1') -ClientDirectory (Join-Path $verify 'client') -ProjectDirectory (Join-Path $verify 'project') -MinAliveSeconds 8
          if($LASTEXITCODE -ne 0){throw 'Extracted client smoke failed'}
          Write-Host "FINAL_SHA256=$sha"

      - name: Upload final v50.0.2 Project plus Client
        uses: actions/upload-artifact@v4
        with:
          name: ClassicUO-v50.0.2-BADNEWBIE-YOKO-FINAL-PROJECT-AND-CLIENT
          path: |
            ${{ runner.temp }}/ClassicUO-v50.0.2-BADNEWBIE-YOKO-FINAL-PROJECT-AND-CLIENT.zip
            ${{ runner.temp }}/ClassicUO-v50.0.2-BADNEWBIE-YOKO-FINAL-PROJECT-AND-CLIENT.zip.sha256.txt
          if-no-files-found: error
          retention-days: 7
