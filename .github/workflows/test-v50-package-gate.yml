name: v50 package gate self-test

on:
  push:
    paths:
      - .github/scripts/v50_package_project_client.py
      - .github/workflows/test-v50-package-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-gate-selftest:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile package gate
        shell: pwsh
        run: python -m py_compile .github/scripts/v50_package_project_client.py
      - name: Run package positive and negative fixtures
        shell: pwsh
        run: python .github/scripts/v50_package_project_client.py --self-test
