name: Publish Runtime API Manual payload

on:
  push:
    branches:
      - ClientUO-Age-of-Power
    paths:
      - docs/Runtime-API-Manual/_payload/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Manual
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="docs/Runtime-API-Manual/_payload"
          cat "$PAYLOAD"/chunk-*.b64 > /tmp/runtime-api-manual.b64
          base64 -d /tmp/runtime-api-manual.b64 > /tmp/runtime-api-manual.tar.xz
          EXPECTED="$(tr -d '[:space:]' < "$PAYLOAD/READY")"
          ACTUAL="$(sha256sum /tmp/runtime-api-manual.tar.xz | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          tar -xJf /tmp/runtime-api-manual.tar.xz -C docs/Runtime-API-Manual
          test "$(find docs/Runtime-API-Manual -maxdepth 1 -name 'Part-*.md' | wc -l)" -eq 34
          grep -q 'Command cards: \*\*738\*\*' docs/Runtime-API-Manual/README.md
          rm -rf "$PAYLOAD"

      - name: Commit generated Manual
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Runtime-API-Manual
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Manual changes to commit."
            exit 0
          fi
          git commit -m "Publish complete v50 runtime API manual [skip ci]"
          git push
