name: Sync complete v50 Runtime API Manual

on:
  push:
    branches:
      - ClientUO-Age-of-Power
    paths:
      - _manualsync/READY

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and verify exact Manual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('docs/Runtime-API-Manual')
          old='4528740e9d5a461847f0f23ebfe4862157edc9d6be26a0b69bec8795cce81d71'
          new='fcc7bb0bebe94e4b617e1dcb4ab316337d111a1c458a79bda0ae818cb2d4f2bb'
          for p in [root/'README.md', *sorted(root.glob('Part-*.md'))]:
              p.write_text(p.read_text().replace(old,new))
          def replace_card(path, heading, card_file):
              text=path.read_text(); start=text.index(heading)
              end=text.index('\n---\n',start)+5
              card=Path(card_file).read_text()
              path.write_text(text[:start]+card+text[end:])
          replace_card(root/'Part-28.md','## `UO.SetRec`','.github/scripts/v50-setrec-card.md')
          replace_card(root/'Part-31.md','## `UO.UseRec`','.github/scripts/v50-userec-card.md')
          p=root/'README.md'; text=p.read_text()
          text=text.replace('| [Part-28.md](Part-28.md) | `SetMulPath` → `SkillVal` | 24 | 34828 |','| [Part-28.md](Part-28.md) | `SetMulPath` → `SkillVal` | 24 | 35165 |')
          text=text.replace('| [Part-31.md](Part-31.md) | `Unequip` → `UseSelfPaperdollScroll` | 23 | 34873 |','| [Part-31.md](Part-31.md) | `Unequip` → `UseSelfPaperdollScroll` | 23 | 34774 |')
          text=text.replace('- `SetRec`, `UseRec` and global `remain()` are historical Script.dll-only compatibility surfaces whose original help pages did not define behavior; this runtime does not invent fake recorder semantics.','- `UO.SetRec()` arms the v50 one-shot legacy-command recorder; `UO.UseRec()` replays the captured action and global `remain()` reports whether a recording is available (`0`/`1`).')
          p.write_text(text)
          PY
          sha256sum -c .github/scripts/v50_runtime_api_manual.sha256
          test "$(find docs/Runtime-API-Manual -maxdepth 1 -name 'Part-*.md' | wc -l)" -eq 34
          grep -q 'Command cards: \*\*738\*\*' docs/Runtime-API-Manual/README.md
          grep -q 'Manifest UO coverage: \*\*734/734\*\*' docs/Runtime-API-Manual/README.md
          git diff --check

      - name: Commit exact Manual
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Runtime-API-Manual
          if git diff --cached --quiet; then
            echo 'Manual already exact.'
            exit 0
          fi
          git commit -m 'Sync complete v50 Runtime API Manual [skip ci]'
          git push
