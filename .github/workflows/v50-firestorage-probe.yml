name: v50 firestorage probe

on:
  push:
    paths:
      - .github/workflows/v50-firestorage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Inspect firestorage share page for direct download endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            'https://firestorage.ai/ja/f/ENGSULZWiyg3',
            'https://firestorage.ai/ja/f/vO3RI-uepxuC',
            'https://firestorage.ai/ja/f/L0ABqCBELFZo'
          )
          $i=0
          foreach ($url in $urls) {
            $r = Invoke-WebRequest -Uri $url -UseBasicParsing -MaximumRedirection 10
            Write-Host "===== SHARE $i status=$($r.StatusCode) bytes=$($r.RawContentLength) final=$($r.BaseResponse.RequestMessage.RequestUri.AbsoluteUri) ====="
            $html = $r.Content
            $hrefs = [regex]::Matches($html,'(?i)(?:href|src)=["'']([^"'']+)["'']') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            $interesting = $hrefs | Where-Object { $_ -match '(?i)download|file|object|storage|api|attachment|signed|presign|s3|r2' }
            if (-not $interesting) { $interesting = $hrefs }
            $interesting | ForEach-Object { Write-Host "LINK[$i]=$_" }
            $patterns = @('https?://[^"''<> ]+','/api/[^"''<> ]+','/download[^"''<> ]*')
            foreach ($p in $patterns) {
              [regex]::Matches($html,$p) | ForEach-Object { Write-Host "TOKEN[$i]=$($_.Value)" }
            }
            $snippet = ($html -replace "`r|`n",' ')
            if ($snippet.Length -gt 12000) { $snippet = $snippet.Substring(0,12000) }
            Write-Host "HTML[$i]=$snippet"
            $i++
          }
