name: v50 firestorage probe

on:
  push:
    paths:
      - .github/workflows/v50-firestorage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Inspect firestorage route JS exactly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls=@(
            'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js',
            'https://firestorage.ai/_next/static/chunks/8500-f4d7bfbe7500f274.js',
            'https://firestorage.ai/_next/static/chunks/8437-d65cc193dc908afa.js',
            'https://firestorage.ai/_next/static/chunks/5841-1160578ba9bb4f3e.js',
            'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          )
          foreach($url in $urls){
            $r=Invoke-WebRequest -Uri $url -UseBasicParsing
            Write-Host "===== URL=$url status=$($r.StatusCode) bytes=$($r.RawContentLength) ====="
            Write-Host $r.Content
          }
