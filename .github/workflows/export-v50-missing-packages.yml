name: Export v50 missing framework packages

on:
  push:
    branches:
      - ClientUO-Age-of-Power
    paths:
      - _nugetcache/MISSING_READY
      - .github/workflows/export-v50-missing-packages.yml

permissions:
  contents: read

jobs:
  export-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Pin SDK
        shell: bash
        run: |
          echo '{"sdk":{"version":"10.0.302","rollForward":"disable"}}' > global.json
          test "$(dotnet --version)" = "10.0.302"

      - name: Restore compatible package dependencies
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          # These are ordinary PackageReference packages. Restoring them through
          # a synthetic net8 project intentionally brings in their transitives.
          pairs = [
              ('NETStandard.Library', '2.0.3'),
              ('System.Numerics.Vectors', '4.4.0'),
              ('System.Numerics.Vectors', '4.5.0'),
              ('Microsoft.NETFramework.ReferenceAssemblies.net472', '1.0.3'),
          ]

          root = Path(os.environ['RUNNER_TEMP']) / 'restore'
          for index, (package, version) in enumerate(pairs):
              project_dir = root / f'p{index:02d}'
              project_dir.mkdir(parents=True, exist_ok=True)
              (project_dir / 'p.csproj').write_text(
                  '<Project Sdk="Microsoft.NET.Sdk">'
                  '<PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>'
                  f'<ItemGroup><PackageReference Include="{package}" Version="{version}" /></ItemGroup>'
                  '</Project>',
                  encoding='utf-8',
              )
              subprocess.run(
                  ['dotnet', 'restore', str(project_dir / 'p.csproj'), '--verbosity', 'minimal'],
                  check=True,
              )
          PY

      - name: Seed exact DotnetPlatform packages without PackageReference
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import json
          import os
          import shutil
          import time
          import urllib.request
          import zipfile

          # Runtime/host packs use package type DotnetPlatform. Adding them as a
          # PackageReference to a normal project fails with NU1213, so seed the
          # exact NuGet global-packages layout directly from the NuGet flat feed.
          pairs = [
              ('Microsoft.NETCore.App.Runtime.linux-x64', '10.0.10'),
              ('Microsoft.AspNetCore.App.Runtime.linux-x64', '10.0.10'),
              ('Microsoft.NETCore.App.Runtime.NativeAOT.linux-x64', '10.0.10'),
              ('Microsoft.NETCore.App.Host.linux-x64', '8.0.29'),
          ]

          package_root = Path(os.environ['NUGET_PACKAGES'])
          package_root.mkdir(parents=True, exist_ok=True)
          source = 'https://api.nuget.org/v3/index.json'

          def download(url: str) -> bytes:
              last_error = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'ClassicUO-v50-cache-export/1.0'})
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read()
                      if not data:
                          raise RuntimeError('empty response')
                      return data
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed after 3 attempts: {url}: {last_error}')

          for package, version in pairs:
              package_id = package.lower()
              version_id = version.lower()
              nupkg_name = f'{package_id}.{version_id}.nupkg'
              url = f'https://api.nuget.org/v3-flatcontainer/{package_id}/{version_id}/{nupkg_name}'
              print(f'Downloading {package} {version}')
              data = download(url)

              with zipfile.ZipFile(io.BytesIO(data), 'r') as archive:
                  bad_member = archive.testzip()
                  if bad_member is not None:
                      raise RuntimeError(f'corrupt nupkg {nupkg_name}: {bad_member}')
                  for member in archive.infolist():
                      path = PurePosixPath(member.filename)
                      if path.is_absolute() or '..' in path.parts:
                          raise RuntimeError(f'unsafe nupkg entry in {nupkg_name}: {member.filename}')

                  destination = package_root / package_id / version_id
                  if destination.exists():
                      shutil.rmtree(destination)
                  destination.mkdir(parents=True, exist_ok=True)
                  archive.extractall(destination)

              nupkg_path = destination / nupkg_name
              nupkg_path.write_bytes(data)
              content_hash = base64.b64encode(hashlib.sha512(data).digest()).decode('ascii')
              (destination / f'{nupkg_name}.sha512').write_text(content_hash, encoding='ascii')

              nuspecs = list(destination.glob('*.nuspec'))
              if len(nuspecs) != 1:
                  raise RuntimeError(f'expected one nuspec in {nupkg_name}, found {len(nuspecs)}')
              canonical_nuspec = destination / f'{package_id}.nuspec'
              if nuspecs[0] != canonical_nuspec:
                  shutil.copyfile(nuspecs[0], canonical_nuspec)

              metadata = {
                  'version': 2,
                  'contentHash': content_hash,
                  'source': source,
              }
              (destination / '.nupkg.metadata').write_text(
                  json.dumps(metadata, separators=(',', ':')),
                  encoding='utf-8',
              )

              if not nupkg_path.is_file() or nupkg_path.stat().st_size == 0:
                  raise RuntimeError(f'cache seed failed: {nupkg_path}')
              print(f'Seeded {package_id}/{version_id} ({nupkg_path.stat().st_size} bytes)')
          PY

      - name: Verify exact cache entries
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          expected = [
              ('netstandard.library', '2.0.3'),
              ('system.numerics.vectors', '4.4.0'),
              ('system.numerics.vectors', '4.5.0'),
              ('microsoft.netframework.referenceassemblies.net472', '1.0.3'),
              ('microsoft.netcore.app.runtime.linux-x64', '10.0.10'),
              ('microsoft.aspnetcore.app.runtime.linux-x64', '10.0.10'),
              ('microsoft.netcore.app.runtime.nativeaot.linux-x64', '10.0.10'),
              ('microsoft.netcore.app.host.linux-x64', '8.0.29'),
          ]
          root = Path(os.environ['NUGET_PACKAGES'])
          missing = []
          for package, version in expected:
              folder = root / package / version
              nupkg = folder / f'{package}.{version}.nupkg'
              sha = folder / f'{package}.{version}.nupkg.sha512'
              nuspec = folder / f'{package}.nuspec'
              if not folder.is_dir() or not nupkg.is_file() or not sha.is_file() or not nuspec.is_file():
                  missing.append(f'{package}/{version}')
          if missing:
              raise SystemExit('missing cache entries: ' + ', '.join(missing))
          print(f'Exact cache entries verified: {len(expected)}/{len(expected)}')
          PY
          du -sh "$NUGET_PACKAGES"

      - name: Pack exact cache
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget
        run: |
          set -euo pipefail
          tar -C "$NUGET_PACKAGES" -cJf "$RUNNER_TEMP/v50-missing-framework-packages.tar.xz" .
          sha256sum "$RUNNER_TEMP/v50-missing-framework-packages.tar.xz" > "$RUNNER_TEMP/v50-missing-framework-packages.tar.xz.sha256"
          tar -tJf "$RUNNER_TEMP/v50-missing-framework-packages.tar.xz" >/dev/null
          ls -lh "$RUNNER_TEMP/v50-missing-framework-packages.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: v50-missing-framework-packages
          path: |
            ${{ runner.temp }}/v50-missing-framework-packages.tar.xz
            ${{ runner.temp }}/v50-missing-framework-packages.tar.xz.sha256
          compression-level: 0
          retention-days: 1
