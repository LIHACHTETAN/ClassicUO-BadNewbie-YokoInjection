          'Part-27.md':'af16a6804a186c04993bf17d857f295889261716f6dc4f2651ac4a9254b375ce',
          'Part-28.md':'c41c417bcd63d6eb2b9afa8f486fed615040733784517e1aae8405017392c984',
          'Part-29.md':'751ff40aba9c1042faeb06ee6e42754dd98739ab065883da2578530b72649958',
          'Part-30.md':'4ac30a974c70192ece50a240f6c6247bce1d3ec33bae630446483e4e4db6ce5e',
          'Part-31.md':'ce72c1a0bffcf38c3241de5609d8200e3c034d79eeaaceaaddc7418b045b352a',
          'Part-32.md':'92dece3e3825db7b0bfdb6519225e9cc882ad56416f31d7a7bcc15468e90b84d',
          'Part-33.md':'1a0ed64eb93ccda87e10b0681565982efbd049da7dc4fc8d04dd500d8a2226ac',
          'Part-34.md':'8bfeefcc5abb44731f21584d8216bcfed39be5be67debde0fe0ec9b472b23aa4',
          'README.md':'2af639f3e89b6fcae69735cff76de17311f6b480639c995fd9e6ad2c850ca31e',
          }

          actual_files = sorted(p.name for p in root.iterdir() if p.is_file())
          if actual_files != sorted(expected):
              print('EXPECTED_FILES', sorted(expected))
              print('ACTUAL_FILES', actual_files)
              raise SystemExit('Manual top-level file set mismatch')

          failures=[]
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if got != want:
                  failures.append((name,want,got))
          if failures:
              for row in failures:
                  print('HASH_MISMATCH', *row)
              raise SystemExit(1)
          print('GITHUB_MANUAL_EXACT_MATCH=35/35')
          PY

          grep -q 'Command cards: \*\*738\*\*' docs/Runtime-API-Manual/README.md
          grep -q 'Manifest UO coverage: \*\*738/738\*\*' docs/Runtime-API-Manual/README.md
          test "$(find docs/Runtime-API-Manual -maxdepth 1 -name 'Part-*.md' | wc -l)" -eq 34
          test "$(find docs/Runtime-API-Manual -maxdepth 1 -type f | wc -l)" -eq 35
          git diff --check

      - name: Commit final Manual
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Runtime-API-Manual
          if git diff --cached --quiet; then
            echo 'No Manual changes required.'
            exit 0
          fi
          git commit -m 'Finalize exact v50 Runtime API Manual [skip ci]'
          git push
