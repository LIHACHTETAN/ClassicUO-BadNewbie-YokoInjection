name: Export .NET SDK 10.0.302

on:
  push:
    branches:
      - ClientUO-Age-of-Power
    paths:
      - _buildsdk/READY
      - .github/workflows/export-dotnet-sdk.yml

permissions:
  contents: read

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Pin and verify SDK 10.0.302
        shell: bash
        run: |
          set -euo pipefail
          cat > global.json <<'EOF'
          {"sdk":{"version":"10.0.302","rollForward":"disable","allowPrerelease":false}}
          EOF
          test "$(dotnet --version)" = "10.0.302"
          dotnet --info

      - name: Package SDK core into transport chunks
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP"
          CORE="$TMP/dotnet-core-10.0.302"
          mkdir -p "$CORE/sdk"
          cp /usr/share/dotnet/dotnet "$CORE/"
          cp -a /usr/share/dotnet/host "$CORE/"
          cp -a /usr/share/dotnet/sdk/10.0.302 "$CORE/sdk/"
          cp -a /usr/share/dotnet/shared "$CORE/"
          tar -C "$TMP" -czf "$TMP/dotnet-core-10.0.302-linux-x64.tar.gz" dotnet-core-10.0.302
          sha256sum "$TMP/dotnet-core-10.0.302-linux-x64.tar.gz" > "$TMP/dotnet-core-10.0.302-linux-x64.tar.gz.sha256"
          split -b 70M -d -a 2 "$TMP/dotnet-core-10.0.302-linux-x64.tar.gz" "$TMP/dotnet-core-10.0.302-linux-x64.part"
          COUNT="$(find "$TMP" -maxdepth 1 -name 'dotnet-core-10.0.302-linux-x64.part*' -type f | wc -l)"
          test "$COUNT" -ge 2
          test "$COUNT" -le 8
          for part in "$TMP"/dotnet-core-10.0.302-linux-x64.part*; do
            test -s "$part"
            sha256sum "$part"
          done
          ls -lh "$TMP"/dotnet-core-10.0.302-linux-x64.part*

      - name: Upload SDK core part 00
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part00
          path: |
            ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part00
            ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload SDK core part 01
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part01
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK core part 02
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part02
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK core part 03
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part03
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK core part 04
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part04
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part04
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK core part 05
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part05
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK core part 06
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part06
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part06
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload SDK core part 07
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-gzip-10.0.302-part07
          path: ${{ runner.temp }}/dotnet-core-10.0.302-linux-x64.part07
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
