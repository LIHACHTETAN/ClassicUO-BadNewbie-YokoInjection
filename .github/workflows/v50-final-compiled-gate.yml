name: v50 final compiled gate

on:
  push:
    paths:
      - .github/workflows/v50-final-compiled-gate.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: ""
  EXPECTED_SHA256: "096c8f9f0688594c079fd77c4ab4f03c705b2110ea89ba043850522bc44d5e72"
  PROFILE_PATCH_READY: "0"
  PROXY_PATCH_READY: "0"
  FINAL_SMOKE_READY: "0"

jobs:
  final-gate:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Guard final gate
        shell: pwsh
        run: |
          $ready = -not [string]::IsNullOrWhiteSpace($env:SOURCE_URL) -and
                   $env:PROFILE_PATCH_READY -eq '1' -and
                   $env:PROXY_PATCH_READY -eq '1' -and
                   $env:FINAL_SMOKE_READY -eq '1'
          if (-not $ready) {
            Write-Host 'Final gate is staged but intentionally disabled until exact v50 profile/proxy patches, source URL and extracted-client smoke route are ready.'
            'V50_GATE_DISABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Setup Python
        if: env.V50_GATE_DISABLED != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup exact .NET SDK
        if: env.V50_GATE_DISABLED != '1'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Download and verify canonical baseline package
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'v50-project-client-baseline.zip'
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile $zip -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $env:EXPECTED_SHA256.ToLowerInvariant()
          Write-Host "BASELINE_SHA256=$actual"
          if ($actual -ne $expected) { throw "Package SHA mismatch: expected $expected got $actual" }
          $root = Join-Path $env:RUNNER_TEMP 'v50-final'
          if (Test-Path $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $project = Join-Path $root 'project'
          $client = Join-Path $root 'client'
          if (-not (Test-Path (Join-Path $project 'ClassicUO.sln'))) { throw 'Missing project/ClassicUO.sln' }
          if (-not (Test-Path $client -PathType Container)) { throw 'Missing client/' }
          "V50_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "V50_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "V50_CLIENT=$client" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply exact reviewed v50 patches
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patcher = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_apply_final_patches.py'
          if (-not (Test-Path $patcher -PathType Leaf)) {
            throw 'v50_apply_final_patches.py is missing; refusing to build unpatched baseline source.'
          }
          & python $patcher --project $env:V50_PROJECT --client $env:V50_CLIENT
          if ($LASTEXITCODE -ne 0) { throw 'Exact v50 patch application failed' }

      - name: Verify exact SDK pin from patched project
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          $v = (& dotnet --version).Trim()
          Write-Host "dotnet=$v"
          if ($v -ne '10.0.302') { throw "Wrong .NET SDK: $v" }

      - name: Verify fresh-profile analyzer itself
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_fresh_profile_contract.py') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-profile analyzer self-test failed' }

      - name: Strict fresh-profile isolation contract
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pm = Join-Path $env:V50_PROJECT 'src/ClassicUO.Client/Configuration/ProfileManager.cs'
          if (-not (Test-Path $pm)) { throw 'ProfileManager.cs missing' }
          & python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_fresh_profile_contract.py') $pm
          if ($LASTEXITCODE -ne 0) { throw 'Strict fresh-profile contract failed' }

      - name: Compile and run isolated proxy transport regression
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proxyHarness = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_proxy_transport_test'
          Push-Location $proxyHarness
          try {
            $v = (& dotnet --version).Trim()
            if ($v -ne '10.0.302') { throw "Proxy harness selected wrong SDK: $v" }
            & dotnet restore 'v50_proxy_transport_test.csproj'
            if ($LASTEXITCODE -ne 0) { throw 'Proxy harness restore failed' }
            & dotnet build 'v50_proxy_transport_test.csproj' -c Release --no-restore -warnaserror
            if ($LASTEXITCODE -ne 0) { throw 'Proxy harness build failed' }
            & dotnet run --project 'v50_proxy_transport_test.csproj' -c Release --no-build
            if ($LASTEXITCODE -ne 0) { throw 'Proxy handshake regression failed' }
          }
          finally { Pop-Location }

      - name: Clean generated build directories before tests
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath $env:V50_PROJECT -Recurse -Directory -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('bin','obj','publish','__pycache__') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force -ErrorAction Stop

      - name: Run deterministic source and model gates
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          $scripts = @(
            'scripts/VerifyProjectSources.py',
            'scripts/TestProfileServerFolderModel.py',
            'scripts/TestGumpApiModel.py',
            'scripts/TestRuntimeBehaviorFixes.py',
            'scripts/TestSearchCore.py',
            'scripts/TestFindTypeModel.py',
            'scripts/TestParamArrayWrapperModel.py',
            'scripts/TestAutoloadMenuModel.py',
            'scripts/VerifyYokoTheiaIde.py',
            'scripts/TestRuntimeContractIntegrity.py',
            'scripts/TestApiManualCurrent.py',
            'scripts/TestApiManualCompleteness.py',
            'scripts/TestConvertedAutoload.py',
            'scripts/VerifyYokoLibrary.py'
          )
          foreach ($s in $scripts) {
            if (Test-Path $s) {
              Write-Host "===== RUN $s ====="
              & python $s
              if ($LASTEXITCODE -ne 0) { throw "$s failed with exit code $LASTEXITCODE" }
            } else {
              Write-Host "SKIP absent optional gate: $s"
            }
          }

      - name: Regenerate API Manual and retest
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          if (Test-Path 'scripts/GenerateCompleteApiManual.py') {
            & python 'scripts/GenerateCompleteApiManual.py'
            if ($LASTEXITCODE -ne 0) { throw 'GenerateCompleteApiManual.py failed' }
          }
          foreach ($s in @('scripts/TestApiManualCurrent.py','scripts/TestApiManualCompleteness.py','scripts/TestRuntimeContractIntegrity.py')) {
            if (Test-Path $s) {
              & python $s
              if ($LASTEXITCODE -ne 0) { throw "$s failed after Manual regeneration" }
            }
          }

      - name: Restore whole solution
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          & dotnet restore 'ClassicUO.sln' -p:Configuration=Release '-p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed' }

      - name: Release build whole solution warnings as errors
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          & dotnet build 'ClassicUO.sln' -c Release --no-restore -warnaserror '-p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed' }

      - name: Discover restore and run every test project
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          $tests = Get-ChildItem -Recurse -File -Filter '*.csproj' |
            Where-Object { $_.Name -match '(?i)test' -or $_.DirectoryName -match '(?i)test' } |
            Sort-Object FullName -Unique
          if (-not $tests) { throw 'No test projects discovered' }
          foreach ($p in $tests) {
            Write-Host "===== RESTORE TEST $($p.FullName) ====="
            & dotnet restore $p.FullName -p:Configuration=Release '-p:Platform=Any CPU'
            if ($LASTEXITCODE -ne 0) { throw "Test restore failed: $($p.FullName)" }
            Write-Host "===== TEST $($p.FullName) ====="
            & dotnet test $p.FullName -c Release --no-restore --logger 'console;verbosity=normal' '-p:Platform=Any CPU'
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($p.FullName)" }
          }

      - name: Remove stale built-client outputs before Windows release pipeline
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($base in @($env:V50_ROOT, $env:V50_PROJECT)) {
            Get-ChildItem -LiteralPath $base -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)^client.*built' } |
              Remove-Item -Recurse -Force
          }

      - name: Run packaged Windows release pipeline
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          $candidate = @('BUILD_V50_WINDOWS.ps1','BUILD_V49_WINDOWS.ps1','BUILD_V48_WINDOWS.ps1') |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $candidate) { throw 'No packaged Windows release pipeline found' }
          Write-Host "===== WINDOWS PIPELINE $candidate ====="
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $candidate
          if ($LASTEXITCODE -ne 0) { throw "$candidate failed with exit code $LASTEXITCODE" }

      - name: Stage freshly built client and reject baseline
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_stage_built_client.py') --package-root $env:V50_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Fresh built-client staging failed' }

      - name: Run exact extracted-client smoke route
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_run_extracted_client_smoke.ps1'
          if (-not (Test-Path $smoke -PathType Leaf)) { throw 'Exact extracted-client smoke helper is missing' }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $smoke -ClientDirectory $env:V50_CLIENT -ProjectDirectory $env:V50_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Built client smoke failed before packaging' }

      - name: Final focused source audit
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:V50_PROJECT
          $code = Get-ChildItem -Recurse -File -Include *.cs,*.py,*.ps1 -ErrorAction SilentlyContinue
          $merge = $code | Select-String -Pattern '^(<<<<<<< .+|=======|>>>>>>> .+)$' -ErrorAction SilentlyContinue
          $impl = $code | Select-String -Pattern 'NotImplementedException|NOT_IMPLEMENTED|IGNORED ARGUMENT' -ErrorAction SilentlyContinue
          $bad = @($merge) + @($impl)
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
            throw 'Final source audit found forbidden implementation/merge markers'
          }

      - name: Clean generated project residues before packaging
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath $env:V50_PROJECT -Recurse -Directory -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('bin','obj','publish','__pycache__') } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $env:V50_PROJECT -Recurse -File -Include *.pyc,*.pyo -ErrorAction SilentlyContinue |
            Remove-Item -Force

      - name: Create final project-client ZIP and verify CRC fresh extraction SHA
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ClassicUO-v50.0.0-BADNEWBIE-YOKO-FINAL-BUILT-TESTED-PROJECT-AND-CLIENT.zip'
          $sha = "$zip.sha256.txt"
          $report = Join-Path $env:RUNNER_TEMP 'V50_FINAL_PACKAGE_REPORT.json'
          & python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_package_project_client.py') `
            --staging-root $env:V50_ROOT --output $zip --sha-sidecar $sha --report $report
          if ($LASTEXITCODE -ne 0) { throw 'Final package gate failed' }
          "FINAL_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FINAL_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FINAL_REPORT=$report" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fresh-extract the final ZIP for mandatory retest
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $retest = Join-Path $env:RUNNER_TEMP 'v50-final-retest'
          if (Test-Path $retest) { Remove-Item -Recurse -Force $retest }
          Expand-Archive -LiteralPath $env:FINAL_ZIP -DestinationPath $retest -Force
          $rp = Join-Path $retest 'project'
          $rc = Join-Path $retest 'client'
          if (-not (Test-Path (Join-Path $rp 'ClassicUO.sln'))) { throw 'Fresh ZIP missing project/ClassicUO.sln' }
          if (-not (Test-Path (Join-Path $rc 'ClassicUO.exe'))) { throw 'Fresh ZIP missing client/ClassicUO.exe' }
          "RETEST_ROOT=$retest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RETEST_PROJECT=$rp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RETEST_CLIENT=$rc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fresh-extracted deterministic and profile retest
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pm = Join-Path $env:RETEST_PROJECT 'src/ClassicUO.Client/Configuration/ProfileManager.cs'
          & python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_fresh_profile_contract.py') $pm
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-extracted profile contract failed' }
          Set-Location $env:RETEST_PROJECT
          $scripts = @(
            'scripts/VerifyProjectSources.py',
            'scripts/TestProfileServerFolderModel.py',
            'scripts/TestGumpApiModel.py',
            'scripts/TestRuntimeBehaviorFixes.py',
            'scripts/TestSearchCore.py',
            'scripts/TestFindTypeModel.py',
            'scripts/TestParamArrayWrapperModel.py',
            'scripts/TestAutoloadMenuModel.py',
            'scripts/VerifyYokoTheiaIde.py',
            'scripts/TestRuntimeContractIntegrity.py',
            'scripts/TestApiManualCurrent.py',
            'scripts/TestApiManualCompleteness.py',
            'scripts/TestConvertedAutoload.py',
            'scripts/VerifyYokoLibrary.py'
          )
          foreach ($s in $scripts) {
            if (Test-Path $s) {
              & python $s
              if ($LASTEXITCODE -ne 0) { throw "Fresh-extracted $s failed" }
            }
          }

      - name: Fresh-extracted restore build and compiled tests
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RETEST_PROJECT
          $v = (& dotnet --version).Trim()
          if ($v -ne '10.0.302') { throw "Fresh-extracted project selected wrong SDK: $v" }
          & dotnet restore 'ClassicUO.sln' -p:Configuration=Release '-p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-extracted restore failed' }
          & dotnet build 'ClassicUO.sln' -c Release --no-restore -warnaserror '-p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-extracted build failed' }
          $tests = Get-ChildItem -Recurse -File -Filter '*.csproj' |
            Where-Object { $_.Name -match '(?i)test' -or $_.DirectoryName -match '(?i)test' } |
            Sort-Object FullName -Unique
          if (-not $tests) { throw 'No fresh-extracted test projects discovered' }
          foreach ($p in $tests) {
            & dotnet restore $p.FullName -p:Configuration=Release '-p:Platform=Any CPU'
            if ($LASTEXITCODE -ne 0) { throw "Fresh-extracted test restore failed: $($p.FullName)" }
            & dotnet test $p.FullName -c Release --no-restore --logger 'console;verbosity=normal' '-p:Platform=Any CPU'
            if ($LASTEXITCODE -ne 0) { throw "Fresh-extracted test failed: $($p.FullName)" }
          }

      - name: Smoke the client from the fresh final ZIP
        if: env.V50_GATE_DISABLED != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/v50_run_extracted_client_smoke.ps1'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File $smoke -ClientDirectory $env:RETEST_CLIENT -ProjectDirectory $env:RETEST_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Fresh final ZIP client smoke failed' }

      - name: Upload final verified release artifacts
        if: env.V50_GATE_DISABLED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: v50-final-built-tested-project-and-client
          path: |
            ${{ runner.temp }}/ClassicUO-v50.0.0-BADNEWBIE-YOKO-FINAL-BUILT-TESTED-PROJECT-AND-CLIENT.zip
            ${{ runner.temp }}/ClassicUO-v50.0.0-BADNEWBIE-YOKO-FINAL-BUILT-TESTED-PROJECT-AND-CLIENT.zip.sha256.txt
            ${{ runner.temp }}/V50_FINAL_PACKAGE_REPORT.json
          if-no-files-found: error
          retention-days: 1
