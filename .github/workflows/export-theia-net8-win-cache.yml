name: Export Theia net8 Windows restore cache

on:
  push:
    branches:
      - ClientUO-Age-of-Power
    paths:
      - _theiacache/READY

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Download exact net8 Windows NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'theia-net8-win-nupkgs'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $packages = [ordered]@{
            'microsoft.netcore.app.runtime.win-x64' = '8.0.29'
            'microsoft.windowsdesktop.app.ref' = '8.0.29'
            'microsoft.windowsdesktop.app.runtime.win-x64' = '8.0.29'
            'microsoft.aspnetcore.app.runtime.win-x64' = '8.0.29'
            'microsoft.netcore.app.host.win-x64' = '8.0.29'
            'microsoft.net.illink.tasks' = '8.0.29'
            'microsoft.web.webview2' = '1.0.4129.50'
          }

          foreach ($entry in $packages.GetEnumerator()) {
            $id = $entry.Key
            $version = $entry.Value
            $file = "$id.$version.nupkg"
            $url = "https://api.nuget.org/v3-flatcontainer/$id/$version/$file"
            Write-Host "Downloading $id $version"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $out $file) -UseBasicParsing
            if (-not (Test-Path (Join-Path $out $file))) { throw "download failed: $file" }
          }

          Get-ChildItem $out -Filter *.nupkg | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($_.Name) $($_.Length) $hash"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: theia-net8-win-nupkgs
          path: ${{ runner.temp }}/theia-net8-win-nupkgs/*.nupkg
          compression-level: 0
          retention-days: 1
